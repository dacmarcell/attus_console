name: attus

services:
  db:
    image: postgres:16-alpine
    container_name: attus-db
    environment:
      POSTGRES_DB: attus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - attus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: attus-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/attus
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:8080/api/produtos || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: attus-web
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  attus_postgres_data:
